url: https://rafaelcabral-ai.github.io/ngvb/

template:
  bootstrap: 5
  bslib:
    primary: "#C64A2E"
    base_font: {google: "Inter"}
    heading_font: {google: "Inter"}
    code_font: {google: "JetBrains Mono"}
  bootswatch: flatly

home:
  title: Latent non-Gaussian models with R-INLA and variational Bayes
  description: >
    Check whether the latent Gaussian assumption of an R-INLA model holds, and
    fit the non-Gaussian extension, each in one line.

navbar:
  structure:
    left:  [intro, articles, reference]
    right: [search, github]
  components:
    reference:
      text: Functions
      href: reference/index.html
    articles:
      text: Vignettes
      menu:
        - text: Get started with ngvb
          href: articles/ngvb.html
        - text: -------
        - text: Worked examples
        - text: Geostatistical data (SPDE)
          href: articles/geostatistical.html
        - text: Areal data (besag)
          href: articles/areal.html
        - text: Random intercepts and slopes
          href: articles/longitudinal.html
        - text: Custom models and ngme2 operators
          href: articles/custom-models.html

articles:
  - title: Getting started
    contents:
      - articles/ngvb

  - title: Worked examples
    desc: >
      One data type per article. Each is self-contained and runs against a real INLA
      installation.
    contents:
      - articles/geostatistical
      - articles/areal
      - articles/longitudinal
      - articles/custom-models

  # The CRAN-shipped stub is just a table of contents pointing back at this site,
  # so it is built but kept off the index page.
  - title: internal
    contents:
      - ngvb_pkg

reference:
  - title: Diagnose and fit
    desc: The two main functions. Both take an ordinary fitted `inla` object.
    contents:
      - ng.check
      - ngvb

  - title: Model comparison
    desc: Integrate the mixing variables out and compare against the Gaussian model.
    contents:
      - ngvb_sample
      - bayes.factor

  - title: Operators and custom models
    desc: The dependency-matrix building blocks, and how to add your own.
    contents:
      - ngvb_operator
      - ngvb_custom
      - ngvb_rgeneric
      - ngvb_precision

  - title: Plotting
    desc: Diagnostic plots and maps for areal and geostatistical data.
    contents:
      - plot.ngvb
      - plot.ngvb.check
      - areal.plot
      - geo.plot

  - title: Methods
    desc: S3 methods for the fitted objects.
    contents:
      - summary.ngvb
      - density.ngvb
      - fitted.ngvb
      - summary.ngvb.samples

  - title: Data
    contents:
      - jumpts
      - Orthodont
