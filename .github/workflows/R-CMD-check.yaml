# Multi-OS R CMD check. Runs on Linux, macOS and Windows.
# Generated in the style of r-lib/actions; INLA is installed from its own repo
# (it is not on CRAN) via the Additional_repositories field in DESCRIPTION.
# Manual/PR-triggered only (no push trigger) -- run it yourself via the
# Actions tab's "Run workflow" button, or `gh workflow run R-CMD-check.yaml`.
on:
  pull_request:
  workflow_dispatch:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          # INLA ships binaries for R 4.3/4.4/4.5 (not the very newest release),
          # so pin to 4.5 to get a full INLA test on every OS. The extra
          # ubuntu-devel job runs the CRAN-forward "INLA absent" path.
          - {os: macos-latest,   r: '4.5', inla: true}
          - {os: windows-latest, r: '4.5', inla: true}
          - {os: ubuntu-latest,  r: '4.5', inla: true}
          - {os: ubuntu-latest,  r: 'devel', inla: false, http-user-agent: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Missing Suggests (e.g. ngme2) must not fail the check.
      _R_CHECK_FORCE_SUGGESTS_: false
      # The INLA tests are gated behind skip_on_cran(); this is what makes them
      # actually run here, on the runners where we do install INLA.
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            INLA=?ignore-before-r=100.0.0
          needs: check

      # Install INLA from its own repository on the R-4.5 jobs (binaries exist for
      # Windows, macOS-arm64 and Linux there), giving a full INLA test on every OS.
      # The devel job skips it and exercises the CRAN "INLA absent" path.
      - name: Install INLA
        if: matrix.config.inla
        run: |
          # The INLA download server is occasionally unreachable for a few
          # minutes; retry a few times before giving up.
          for (attempt in 1:3) {
            ok <- tryCatch({
              install.packages("INLA",
                repos = c(getOption("repos"),
                          INLA = "https://inla.r-inla-download.org/R/stable"),
                dependencies = TRUE)
              requireNamespace("INLA", quietly = TRUE)
            }, error = function(e) FALSE)
            if (isTRUE(ok)) break
            message("INLA install attempt ", attempt, " failed, retrying...")
            Sys.sleep(60)
          }
          stopifnot(requireNamespace("INLA", quietly = TRUE))
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
