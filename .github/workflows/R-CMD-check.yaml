# Multi-OS R CMD check. Runs on Linux, macOS and Windows.
# Generated in the style of r-lib/actions; INLA is installed from its own repo
# (it is not on CRAN) via the Additional_repositories field in DESCRIPTION.
# Manual/PR-triggered only (no push trigger) -- run it yourself via the
# Actions tab's "Run workflow" button, or `gh workflow run R-CMD-check.yaml`.
on:
  pull_request:
  workflow_dispatch:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          # INLA's rgeneric subprocess crashes under R 4.5.x (utf8clen ABI
          # mismatch), so pin to 4.4 which works. The extra
          # ubuntu-devel job runs the CRAN-forward "INLA absent" path.
          - {os: macos-latest,   r: '4.4.2', inla: true}
          - {os: windows-latest, r: '4.4.2', inla: true}
          - {os: ubuntu-latest,  r: '4.4.2', inla: true}
          - {os: ubuntu-latest,  r: 'devel', inla: false, http-user-agent: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Missing Suggests (e.g. ngme2) must not fail the check.
      _R_CHECK_FORCE_SUGGESTS_: false
      # The INLA tests are gated behind skip_on_cran(); this is what makes them
      # actually run here, on the runners where we do install INLA.
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            INLA=?ignore-before-r=100.0.0
          needs: check

      # Install INLA from its own repository on the R-4.5 jobs (binaries exist for
      # Windows, macOS-arm64 and Linux there), giving a full INLA test on every OS.
      # The devel job skips it and exercises the CRAN "INLA absent" path.
      - name: Install INLA
        if: matrix.config.inla
        run: |
          # The INLA download server goes down for stretches at a time; when it
          # does it serves an HTML error page in place of the package index,
          # which surfaces as a misleading "INLA is not available for this
          # version of R". Back off for ~15 minutes and name the failure mode.
          inla_repo <- "https://inla.r-inla-download.org/R/stable"
          backoff   <- c(30, 60, 120, 240, 480)

          # Surface the server's own explanation instead of swallowing it: a
          # muffled warning here is exactly what made the last failure opaque.
          index_ok <- function() {
            unlink(list.files(tempdir(), "^repos_.*[.]rds$", full.names = TRUE))
            withCallingHandlers(
              tryCatch(nrow(available.packages(repos = inla_repo,
                                               ignore_repo_cache = TRUE)) > 0,
                       error = function(e) {
                         message("  error: ", conditionMessage(e)); FALSE
                       }),
              warning = function(w) {
                message("  warning: ", conditionMessage(w))
                invokeRestart("muffleWarning")
              })
          }

          for (attempt in seq_len(length(backoff) + 1L)) {
            if (index_ok()) {
              ok <- tryCatch({
                install.packages("INLA",
                  repos = c(getOption("repos"), INLA = inla_repo),
                  dependencies = TRUE)
                requireNamespace("INLA", quietly = TRUE)
              }, error = function(e) FALSE)
              if (isTRUE(ok)) break
              message("attempt ", attempt, ": index readable but install failed")
            } else {
              message("attempt ", attempt,
                      ": INLA repository index unreadable (server likely down)")
            }
            if (attempt > length(backoff)) break
            message("  retrying in ", backoff[attempt], "s")
            Sys.sleep(backoff[attempt])
          }

          if (!requireNamespace("INLA", quietly = TRUE))
            stop("Could not install INLA from ", inla_repo, " after ",
                 length(backoff) + 1L, " attempts over ~15 minutes. This is an ",
                 "INLA download-server problem, not an ngvb problem; re-run ",
                 "this workflow later.")
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
