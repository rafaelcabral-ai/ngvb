# Build the pkgdown site and deploy it to GitHub Pages.
# Manual/release-triggered only (no push trigger) -- run it yourself via the
# Actions tab's "Run workflow" button, or `gh workflow run pkgdown.yaml`.
on:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions:
  contents: write

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'          # matches the maintainer's local R; see the libR step below for the rgeneric fix
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # INLA is not on CRAN; skip it in dependency resolution and install it
          # explicitly below (same pattern as R-CMD-check.yaml).
          extra-packages: |
            any::pkgdown
            local::.
            INLA=?ignore-before-r=100.0.0
          needs: website

      # Diagnostic only; never fails the job. The INLA download server has
      # twice served an HTML page in place of its package index to this runner
      # while serving the real index fine from a developer machine. Record what
      # the runner actually receives so the cause is evidence rather than guess.
      - name: Probe INLA repository
        continue-on-error: true
        run: |
          url=https://inla.r-inla-download.org/R/stable/src/contrib/PACKAGES
          echo "----- runner egress IP -----"
          curl -s --max-time 20 https://api.ipify.org || true; echo
          echo "----- host root reachable? -----"
          curl -sS -o /dev/null -w 'http=%{http_code} ip=%{remote_ip}\n' \
            --max-time 30 https://inla.r-inla-download.org/ || true
          echo "----- index response headers -----"
          curl -sSI --max-time 30 "$url" || true
          echo "----- index body, first 300 bytes -----"
          curl -sS --max-time 30 "$url" | head -c 300 || true; echo
          echo "----- what R makes of it -----"
          Rscript -e 'withCallingHandlers(
            print(utils::head(utils::available.packages(
              repos = "https://inla.r-inla-download.org/R/stable",
              ignore_repo_cache = TRUE)[, c("Package", "Version"), drop = FALSE])),
            warning = function(w) message("R warning: ", conditionMessage(w)))' || true

      - name: Install INLA
        run: |
          # The INLA download server goes down for stretches at a time. On
          # 2026-08-09 it served an HTML error page in place of the package
          # index for longer than the old 3-attempt/60s loop could cover, and
          # the run failed with a misleading "INLA is not available for this
          # version of R". Back off for ~15 minutes and name the failure mode.
          inla_repo <- "https://inla.r-inla-download.org/R/stable"
          backoff   <- c(30, 60, 120, 240, 480)

          # Surface the server's own explanation instead of swallowing it: a
          # muffled warning here is exactly what made the last failure opaque.
          index_ok <- function() {
            unlink(list.files(tempdir(), "^repos_.*[.]rds$", full.names = TRUE))
            withCallingHandlers(
              tryCatch(nrow(available.packages(repos = inla_repo,
                                               ignore_repo_cache = TRUE)) > 0,
                       error = function(e) {
                         message("  error: ", conditionMessage(e)); FALSE
                       }),
              warning = function(w) {
                message("  warning: ", conditionMessage(w))
                invokeRestart("muffleWarning")
              })
          }

          for (attempt in seq_len(length(backoff) + 1L)) {
            if (index_ok()) {
              ok <- tryCatch({
                install.packages("INLA",
                  repos = c(getOption("repos"), INLA = inla_repo),
                  dependencies = TRUE)
                requireNamespace("INLA", quietly = TRUE)
              }, error = function(e) FALSE)
              if (isTRUE(ok)) break
              message("attempt ", attempt, ": index readable but install failed")
            } else {
              message("attempt ", attempt,
                      ": INLA repository index unreadable (server likely down)")
            }
            if (attempt > length(backoff)) break
            message("  retrying in ", backoff[attempt], "s")
            Sys.sleep(backoff[attempt])
          }

          if (!requireNamespace("INLA", quietly = TRUE))
            stop("Could not install INLA from ", inla_repo, " after ",
                 length(backoff) + 1L, " attempts over ~15 minutes. This is an ",
                 "INLA download-server problem, not an ngvb problem; re-run ",
                 "this workflow later.")
        shell: Rscript {0}

      # INLA bundles its own libR.so, and its inla.*.run wrapper puts that
      # directory on LD_LIBRARY_PATH. When the inla binary spawns R to evaluate
      # an rgeneric model, that subprocess loads grDevices.so, whose NEEDED
      # libR.so then resolves to INLA's bundled copy rather than the running R.
      # That copy predates the R we run here and lacks utf8clen, which is the
      # "undefined symbol: utf8clen" every ngvb() call died on. Point the
      # bundled name at the real library so both the inla binary and the
      # subprocess get a libR that matches the R in use.
      - name: Make INLA's bundled libR match the running R
        run: |
          set -u
          inla_dir=$(Rscript -e 'cat(system.file(package="INLA"))')
          bin="$inla_dir/bin/linux/64bit"
          real_libR=$(Rscript -e 'cat(file.path(R.home("lib"), "libR.so"))')

          echo "--- inla.mkl.run wrapper (how LD_LIBRARY_PATH is built) ---"
          cat "$bin/inla.mkl.run" || true

          echo "--- does the inla binary itself need libR? ---"
          ldd "$bin/inla.mkl" 2>&1 | grep -i 'libR' || echo "  (inla.mkl does not link libR)"

          echo "--- repointing bundled libR.so -> $real_libR ---"
          if [ ! -f "$real_libR" ]; then
            echo "real libR.so not found; leaving INLA untouched"; exit 0
          fi
          if [ -f "$bin/libR.so" ] && [ ! -L "$bin/libR.so" ]; then
            mv -v "$bin/libR.so" "$bin/libR.so.bundled-unused"
          fi
          ln -sfn "$real_libR" "$bin/libR.so"
          ls -la "$bin/libR.so"

          echo "--- minimal rgeneric smoke test ---"
          Rscript -e '
            n <- 30; set.seed(1)
            d <- data.frame(y = rnorm(n), i = seq_len(n))
            rgen <- INLA::inla.rgeneric.define(INLA::inla.rgeneric.ar1.model, n = n)
            r <- try(INLA::inla(y ~ -1 + f(i, model = rgen), data = d), silent = TRUE)
            if (inherits(r, "try-error")) {
              cat("RGENERIC STILL BROKEN:\n", conditionMessage(attr(r, "condition")), "\n")
              quit(status = 1)
            }
            cat("RGENERIC OK\n")
          '

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
