# Build the pkgdown site and deploy it to GitHub Pages.
# Manual/release-triggered only (no push trigger) -- run it yourself via the
# Actions tab's "Run workflow" button, or `gh workflow run pkgdown.yaml`.
on:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions:
  contents: write

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'          # INLA ships binaries for 4.5, so the vignette article renders with real output
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # INLA is not on CRAN; skip it in dependency resolution and install it
          # explicitly below (same pattern as R-CMD-check.yaml).
          extra-packages: |
            any::pkgdown
            local::.
            INLA=?ignore-before-r=100.0.0
          needs: website

      - name: Install INLA
        run: |
          install.packages("INLA",
            repos = c(getOption("repos"),
                      INLA = "https://inla.r-inla-download.org/R/stable"),
            dependencies = TRUE)
        shell: Rscript {0}

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
